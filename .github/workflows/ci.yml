name: CI & Release

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Tkinter & Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk xvfb

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest under Xvfb
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" pytest -v

  build:
    name: Build (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ToDoList-Windows
            artifact_path: dist/windows/ToDoList.exe
          - os: macos-latest
            artifact_name: ToDoList-macOS
            artifact_path: dist/macos/ToDoList-macOS.tar.gz
          - os: ubuntu-latest
            artifact_name: ToDoList-Linux
            artifact_path: dist/linux/ToDoList

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linux Tkinter dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk binutils

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ensure no database files exist before build
        run: find . -maxdepth 3 \( -name "*.db" -o -name "*.sqlite" -o -name "*.sqlite3" \) -delete
        shell: bash

      - name: Build executable with build.py
        run: python build.py

      - name: Archive macOS app bundle
        if: runner.os == 'macOS'
        run: tar -czf dist/macos/ToDoList-macOS.tar.gz -C dist/macos ToDoList.app

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p dist-release
          cp release-artifacts/ToDoList-Windows/ToDoList.exe dist-release/ToDoList-Windows.exe
          cp release-artifacts/ToDoList-Linux/ToDoList dist-release/ToDoList-Linux
          cp release-artifacts/ToDoList-macOS/ToDoList-macOS.tar.gz dist-release/ToDoList-macOS.tar.gz
          chmod +x dist-release/ToDoList-Linux

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-release/ToDoList-Windows.exe
            dist-release/ToDoList-macOS.tar.gz
            dist-release/ToDoList-Linux
