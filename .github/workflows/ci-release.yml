name: CI & Release

on:
  workflow_dispatch:
  push:
    branches-ignore: [main, dev]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce38c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies (Tkinter & Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk xvfb

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest under Xvfb
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" pytest -v

  build:
    name: Build (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ToDoList-Windows
            artifact_path: dist/windows/ToDoList.exe
          - os: macos-latest
            artifact_name: ToDoList-macOS
            artifact_path: dist/macos/ToDoList-macOS.tar.gz
          - os: ubuntu-latest
            artifact_name: ToDoList-Linux
            artifact_path: dist/linux/ToDoList

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce38c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install Linux Tkinter and Xvfb dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk binutils xvfb

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ensure no database files exist before build
        run: find . -maxdepth 3 \( -name "*.db" -o -name "*.sqlite" -o -name "*.sqlite3" \) -delete
        shell: bash

      - name: Build executable with build.py
        run: python build.py

      - name: Smoke test Linux executable
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/linux/ToDoList
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" ./dist/linux/ToDoList --help

      - name: Archive macOS app bundle
        if: runner.os == 'macOS'
        run: tar -czf dist/macos/ToDoList-macOS.tar.gz -C dist/macos ToDoList.app

      - name: Upload platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab780b905d4f60d64d # v4.2.1
        with:
          path: release-artifacts

      - name: Prepare release assets and SHA-256 checksums
        run: |
          mkdir -p dist-release
          cp release-artifacts/ToDoList-Windows/ToDoList.exe dist-release/ToDoList-Windows.exe
          cp release-artifacts/ToDoList-Linux/ToDoList dist-release/ToDoList-Linux
          cp release-artifacts/ToDoList-macOS/ToDoList-macOS.tar.gz dist-release/ToDoList-macOS.tar.gz
          chmod +x dist-release/ToDoList-Linux
          (cd dist-release && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c062e08bd532516eafdef8ee72fcccc073cef3f3 # v2.2.1
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            dist-release/ToDoList-Windows.exe
            dist-release/ToDoList-macOS.tar.gz
            dist-release/ToDoList-Linux
            dist-release/SHA256SUMS.txt
