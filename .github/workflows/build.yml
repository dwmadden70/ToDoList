name: Build Cross-Platform Executables

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_dir: dist/windows
          - os: macos-latest
            artifact_dir: dist/macos
          - os: ubuntu-latest
            artifact_dir: dist/linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Tkinter dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build executable
        run: python build.py

      - name: Upload built binary
        uses: actions/upload-artifact@v4
        with:
          name: ToDoList-${{ runner.os }}
          path: ${{ matrix.artifact_dir }}
