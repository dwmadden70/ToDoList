[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "todolist"
version = "0.1.0"
description = "A lightweight cross-platform desktop to-do list app."
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
    "pillow>=10.0.0",
]

[project.gui-scripts]
todolist = "todolist.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]